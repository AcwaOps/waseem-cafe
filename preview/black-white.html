<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waseem Cafe | Black & White Menu</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#000;font-family:Arial,Helvetica,sans-serif}.sheet{width:min(100%,720px);min-height:100vh;margin:auto;padding:30px 48px;background:#fff;box-shadow:0 8px 36px #0002}.brand{text-align:center;padding:14px 0 22px;position:relative}.brand h1{font:700 clamp(46px,8vw,70px)/.92 Georgia,serif;letter-spacing:-3px;margin:0}.brand h1 span{display:block}.mascot{position:absolute;right:9%;top:0;font-size:38px}.eyebrow{font-size:11px;letter-spacing:.23em;margin:12px}.rule{height:1px;background:#000;width:70%;margin:12px auto}.section{margin-top:19px}.section h2{font:bold 20px Arial;letter-spacing:.12em;border-bottom:1px solid #000;margin:0;padding:0 0 7px}.item{display:flex;gap:15px;align-items:center;padding:9px 0;border-bottom:1px solid #bbb;min-height:66px}.cup{width:43px;height:47px;flex:none;border:1.5px solid #000;border-radius:5px 5px 11px 11px;position:relative;background:#fff}.cup:before{content:'';position:absolute;left:-3px;right:-3px;top:-4px;height:7px;border:1.5px solid #000;border-radius:50%;background:#fff}.cup:after{content:'W';position:absolute;top:21px;left:0;right:0;text-align:center;font:11px Georgia;color:#000}.detail{flex:1}.detail h3{font-size:16px;margin:0 0 3px}.price{font-size:13px}.footer{display:flex;justify-content:center;align-items:center;gap:28px;padding:21px 0 0}.qr{text-align:center}.qr svg{width:112px;height:112px}.qr p{font-size:11px}.contacts{text-align:center;font-size:12px}.contacts a{display:block;color:#000;margin:8px}.note{text-align:center;font-size:10px;color:#444}.printfoot{display:none}

</style></head><body><main class="sheet"><header class="brand"><div class="mascot">☕</div><h1>Waseem <span>Cafe</span></h1><div class="rule"></div><p class="eyebrow">COFFEE · TEA · JUICE</p></header><div id="menu"></div><footer class="footer"><div class="qr"><div id="qr"></div><p>Scan to view our menu</p></div><div class="contacts"><a href="tel:+966511313965">Call Waseem: 051 131 3965</a><a href="https://wa.me/966511313965">WhatsApp: 051 131 3965</a></div></footer><p class="note">Black-and-white static visual preview · Menu editing is not enabled.</p><p class="printfoot">Waseem Cafe · Thank you for visiting</p></main><script>
const target='https://acwaops.github.io/waseem-cafe/';const data=[{name:'Latte',cat:'Coffee',hot:5,iced:8},{name:'Cappuccino',cat:'Coffee',hot:5,iced:8},{name:'Mocha',cat:'Coffee',hot:5,iced:8},{name:'Americano',cat:'Coffee',hot:5,iced:10},{name:'V60',cat:'Coffee',single:10},{name:'Karak Tea',cat:'Tea & Juice',hot:3},{name:'Fresh Juice',cat:'Tea & Juice',single:5}],sar=n=>'⃁ '+n;function qr(s){let seed=0;for(let c of s)seed=(seed*31+c.charCodeAt(0))>>>0;let out='';function f(x,y){for(let j=0;j<7;j++)for(let i=0;i<7;i++)if(i===0||j===0||i===6||j===6||(i>=2&&i<=4&&j>=2&&j<=4))out+=`<rect x="${x+i}" y="${y+j}" width="1" height="1"/>`}f(0,0);f(22,0);f(0,22);for(let y=0;y<29;y++)for(let x=0;x<29;x++){if((x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20))continue;seed=(seed*1664525+1013904223)>>>0;if(seed>>>31)out+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 37 37"><rect x="-4" y="-4" width="37" height="37" fill="white"/><g fill="black">${out}</g></svg>`}document.getElementById('qr').innerHTML=qr(target);for(const cat of ['Coffee','Tea & Juice']){let s=document.createElement('section');s.className='section';s.innerHTML='<h2>'+cat+'</h2>';data.filter(x=>x.cat===cat).forEach(p=>{let r=document.createElement('article');r.className='item';let price=(p.hot!==undefined?`Hot ${sar(p.hot)}`:'')+(p.iced!==undefined?`　|　Iced ${sar(p.iced)}`:'')+(p.single!==undefined?sar(p.single):'');r.innerHTML=`<div class="cup"></div><div class="detail"><h3>${p.name}</h3><div class="price">${price}</div></div>`;s.append(r)});document.getElementById('menu').append(s)}
</script></body></html>
